<div class="page-container">
  <header class="topbar">
    <button class="menu-btn" (click)="toggleSidebar()" aria-label="Abrir menu">&#9776;</button>

    <div class="user-menu-wrapper">
      <button class="user-btn" (click)="toggleUserMenu()">
       <svg class="user-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      </button>

      <div class="user-dropdown" *ngIf="userMenuOpen">
        <a routerLink="" class="dropdown-item">Logout</a>
      </div>
    </div>
  </header>

  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Ford_logo_flat.svg" alt="Ford Logo" class="ford-logo">
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" (click)="toggleSidebar()" class="nav-item active">Home</a>
      <a routerLink="/vehicle" (click)="toggleSidebar()" class="nav-item">Dashboard</a>
    </nav>
  </aside>
  <div class="backdrop" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <main class="main-content">
    <div class="hero-wrapper">
      <img src="http://localhost:3001/img/ranger.png" alt="Ranger" class="ranger-img">
      
      <div class="welcome-card">
        <div class="card-header">Sistema de Gestão FORD</div>
        <div class="card-body">
          <p class="welcome-text">Seja bem-vindo(a)!</p>
        </div>
      </div>
    </div>
  </main>
</div>
