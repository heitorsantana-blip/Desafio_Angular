<div class="login-wrapper">
  <div class="left-side">
    <img src="img/ranger.png" alt="Imagem de fundo">
  </div>

  <div class="right-side">
    <form class="login-form" (ngSubmit)="fazerLogin()">
      <h2>Entrar na conta</h2>
      
      <div class="input-group">
        <label for="email">Usuário</label>
        <input type="text" id="email" [(ngModel)]="nome" name="nome" placeholder="admin" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" [(ngModel)]="senha" name="senha" placeholder="••••••••" required>
      </div>

      <p *ngIf="erro" style="color: red; margin-top: 10px;">{{ erro }}</p>

      <button type="submit" class="btn-submit">Acessar</button>
    </form>
  </div>
</div>
